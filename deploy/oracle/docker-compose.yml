# One Oracle Cloud Always Free VM (Ampere A1, Ubuntu): forecast service behind
# Caddy (HTTPS). Only Caddy publishes ports; the forecast service is reachable
# only on the internal Docker network.
services:
  forecast:
    build: ../../forecast-service
    restart: unless-stopped
    environment:
      FORECAST_API_KEY: ${FORECAST_API_KEY:?set FORECAST_API_KEY in .env}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [forecast]

volumes:
  caddy_data:
